<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BetterButtons quick start</title>
    <link rel="stylesheet" href="../dist/betterbuttons.css" />
    <style>
      body {
        background: #0b0e13;
        color: #f0f4fa;
        display: grid;
        font-family: system-ui, sans-serif;
        gap: 2rem;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        place-content: center;
      }

      main {
        display: grid;
        gap: 2rem;
      }

      section {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BetterButtons quick start</h1>
      <section aria-label="Button examples">
        <button class="bb-btn bb-lime bb-solid bb-lg bb-pill" type="button">Create project</button>
        <button class="bb-btn bb-cyan bb-outline bb-lg bb-rounded" type="button">View details</button>
        <button class="bb-btn bb-violet bb-gradient bb-lg bb-pill bb-anim-shine" type="button">
          Launch update
        </button>
      </section>
    </main>
  </body>
</html>
