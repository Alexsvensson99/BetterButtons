name: Package artifact

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use the reviewed npm CLI
        run: npm install --global npm@11.19.0
      - name: Verify tag and release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify release candidate
        run: npm run check
      - name: Build tarball
        run: |
          mkdir release
          npm pack --pack-destination release
          npm sbom --sbom-format=cyclonedx > release/betterbuttons-sbom.cdx.json
          cd release
          shasum -a 256 *.tgz > SHA256SUMS
      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: betterbuttons-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
