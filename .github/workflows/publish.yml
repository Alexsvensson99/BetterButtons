name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: SHA-256 from the reviewed package artifact
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/betterbuttons
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Use the reviewed npm CLI
        run: npm install --global npm@11.19.0
      - name: Verify tag and release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Revalidate package contents
        run: npm run pack:check
      - name: Build and bind the reviewed tarball
        id: package
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "expected_sha256 must be exactly 64 lowercase hexadecimal characters" >&2
            exit 1
          fi
          mkdir release
          npm pack --pack-destination release
          mapfile -t tarballs < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one release tarball" >&2
            exit 1
          fi
          tarball=${tarballs[0]}
          actual_sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Tarball checksum does not match the reviewed package artifact" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Verify the version-bound publication gate
        env:
          BETTERBUTTONS_PUBLISH: ${{ github.ref_name }}
        run: node scripts/publish-guard.mjs
      - name: Publish the inspected tarball with provenance
        env:
          BETTERBUTTONS_PUBLISH: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "./$TARBALL" --access public --provenance --ignore-scripts
